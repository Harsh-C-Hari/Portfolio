<section class="section work" id="work" aria-labelledby="work-title">
  <div class="container">
    <header class="section__head">
      <h2 class="title" id="work-title">What I've<br>shipped</h2>
      <p class="section__note">Four projects. Two have full write-ups.</p>
    </header>

    <div class="work-index">
      <ol class="wlist">
        {{work_rows}}
      </ol>

      <aside class="wpanel" aria-label="Project preview">
        <div class="wpanel__frame">
          {{work_panel_previews}}
        </div>
        <div class="wpanel__caption">
          {{work_panel_captions}}
        </div>
      </aside>
    </div>
  </div>
</section>
