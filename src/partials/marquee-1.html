<!-- ============================================================
     VERB REVEAL STRIP
     Pinned per-character brightness-reveal (scroll-scrubbed).
     JS wraps each char in a <span> and drives color via ScrollTrigger.
     Floating keyword pills animate independently on top.
     aria-hidden: decorative identity strip, not semantic content.
     ============================================================ -->
<div class="verb-reveal" aria-hidden="true" data-od-id="verb-reveal">
  <div class="verb-reveal__track">
    <span class="verb-reveal__word" data-word="Build">Build</span><span class="verb-reveal__sep">·</span><span
      class="verb-reveal__word" data-word="Ship">Ship</span><span class="verb-reveal__sep">·</span><span
      class="verb-reveal__word" data-word="Iterate">Iterate</span><span class="verb-reveal__sep">·</span><span
      class="verb-reveal__word" data-word="Break">Break</span><span class="verb-reveal__sep">·</span><span
      class="verb-reveal__word" data-word="Fix">Fix</span><span class="verb-reveal__sep">·</span><span
      class="verb-reveal__word" data-word="Learn">Learn</span><span class="verb-reveal__sep">·</span><span
      class="verb-reveal__word" data-word="Deploy">Deploy</span>
  </div>

  <!-- Floating keyword pills — animate in independently over the strip -->
  <div class="verb-reveal__pills" aria-hidden="true">
    <span class="kw-pill" style="--cat-hue: var(--c-cat-frontend)">ship</span>
    <span class="kw-pill" style="--cat-hue: var(--c-cat-ai)">iterate</span>
    <span class="kw-pill" style="--cat-hue: var(--c-cat-data)">build</span>
  </div>
</div>
