<!-- ============================================================
   PROJECT DECK OVERLAY
   ============================================================ -->
<div class="project-deck" id="project-deck" aria-hidden="true">
  <div class="project-deck__backdrop" data-deck-close></div>

  <div class="project-deck__panel" role="dialog" aria-modal="true" aria-label="All projects">
    <button class="project-deck__close" type="button" aria-label="Close" data-deck-close>&times;</button>

    <div class="project-deck__card" id="project-deck-card">
      <!-- filled by project-deck.js per current index -->
    </div>

    <!-- prev/next + counter live together so they can be laid out as one
         row under the card on mobile, while sitting at the panel's left/
         right edges on desktop (see .project-deck__nav in styles.css) -->
    <div class="project-deck__nav">
      <button class="project-deck__arrow project-deck__arrow--prev" type="button" aria-label="Previous project"
        data-deck-prev>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M19 12H5" />
          <path d="M11 18l-6-6 6-6" />
        </svg>
      </button>
      <span class="project-deck__counter mono" id="project-deck-counter" aria-live="polite"></span>
      <button class="project-deck__arrow project-deck__arrow--next" type="button" aria-label="Next project"
        data-deck-next>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M5 12h14" />
          <path d="M13 18l6-6-6-6" />
        </svg>
      </button>
    </div>
  </div>
</div>
